name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Сборка воркера (dry-run)
        run: npx wrangler deploy --dry-run --outdir .wrangler/check

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Секреты воркера берутся из секретов репозитория и загружаются при каждом деплое
          secrets: |
            TELEGRAM_TOKEN
            TOCHKA_TOKEN
            SESSION_SECRET
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TOCHKA_TOKEN: ${{ secrets.TOCHKA_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      # Точный расход Workers AI в админке: нужен токен Cloudflare с правом Account Analytics: Read.
      # Берём отдельный CF_ANALYTICS_TOKEN, если он задан, иначе — деплойный CLOUDFLARE_API_TOKEN (ему выдано это право).
      - name: Доступ к аналитике Cloudflare для админки
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ANALYTICS_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Нет токена или ID аккаунта Cloudflare — пропускаю"; exit 0; fi
          printf '%s' "$CF_ANALYTICS_TOKEN" | npx wrangler secret put CF_ANALYTICS_TOKEN
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CF_ACCOUNT_ID
      # Посредник для API Точки в Yandex Cloud (yandex/tochka-proxy): адрес функции и общий секрет.
      # Загружаются, только если оба секрета заданы в репозитории.
      - name: Посредник для API Точки
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOCHKA_PROXY_URL: ${{ secrets.TOCHKA_PROXY_URL }}
          TOCHKA_PROXY_SECRET: ${{ secrets.TOCHKA_PROXY_SECRET }}
        run: |
          if [ -z "$TOCHKA_PROXY_URL" ] || [ -z "$TOCHKA_PROXY_SECRET" ]; then echo "Посредник Точки не настроен — пропускаю"; exit 0; fi
          printf '%s' "$TOCHKA_PROXY_URL" | npx wrangler secret put TOCHKA_PROXY_URL
          printf '%s' "$TOCHKA_PROXY_SECRET" | npx wrangler secret put TOCHKA_PROXY_SECRET
      # Запасной ИИ на случай, когда бесплатные нейроны Cloudflare на сегодня кончились. Каждый ключ — по желанию.
      - name: Ключи запасного ИИ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$CEREBRAS_API_KEY" ]; then printf '%s' "$CEREBRAS_API_KEY" | npx wrangler secret put CEREBRAS_API_KEY; else echo "CEREBRAS_API_KEY не задан — пропускаю"; fi
          if [ -n "$GROQ_API_KEY" ]; then printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY; else echo "GROQ_API_KEY не задан — пропускаю"; fi
      # Кнопка «Приложение» и меню команд бота — на актуальный адрес сайта (вебхук не трогаем)
      - name: Кнопка меню и команды бота
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: node scripts/set-webhook.mjs --menu-only
      # Быстрая индексация в Яндексе и Bing (IndexNow): отправляем адреса из sitemap.xml
      - name: IndexNow
        run: node scripts/indexnow.mjs || true
