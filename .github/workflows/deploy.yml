name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Сборка воркера (dry-run)
        run: npx wrangler deploy --dry-run --outdir .wrangler/check

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Секреты воркера берутся из секретов репозитория и загружаются при каждом деплое
          secrets: |
            TELEGRAM_TOKEN
            TOCHKA_TOKEN
            SESSION_SECRET
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TOCHKA_TOKEN: ${{ secrets.TOCHKA_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      # Точный расход Workers AI в админке: токен Cloudflare с правом Account Analytics: Read.
      # Загружается, только если секрет CF_ANALYTICS_TOKEN добавлен в репозиторий.
      - name: Доступ к аналитике Cloudflare для админки
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$CF_ANALYTICS_TOKEN" ]; then echo "CF_ANALYTICS_TOKEN не задан — пропускаю"; exit 0; fi
          printf '%s' "$CF_ANALYTICS_TOKEN" | npx wrangler secret put CF_ANALYTICS_TOKEN
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CF_ACCOUNT_ID
