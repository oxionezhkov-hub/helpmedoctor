name: Рассылка партнёрам

# Точечная рассылка организаторам, СМИ и сообществам (scripts/outreach-mail.mjs): по будням в 09:20 МСК,
# запасные запуски в 11:47 и 14:13 МСК — GitHub иногда сильно опаздывает или пропускает расписание. Лишнего не уйдёт:
# скрипт отправляет не больше дневного лимита за сутки, сколько бы запусков ни было.
# Ничего не отправляет, пока в content/outreach/mailing/config.json не стоит enabled: true.
# Состояние (кому и когда написали, кто ответил) хранится в ветке outreach-state: state.json и status.csv.
# Бот запускает отправку в 09:20 и 15:20 МСК; в остальные часы до 21:20 проверяет ответы на утреннюю рассылку.
# Дневные письма используют тот же ящик и отдельный лимит, ответы видны в ящике.
# Секреты: SMTP_USER (адрес ящика), SMTP_PASS (пароль приложения), TELEGRAM_TOKEN и OUTREACH_TG_CHAT (секрет или переменная).
on:
  schedule:
    - cron: "20 6 * * 1-5"
    - cron: "47 8 * * 1-5"
    - cron: "13 11 * * 1-5"
    - cron: "43 13 * * 1-5" # резерв дневной рассылки в 16:43 МСК
  workflow_dispatch:
    inputs:
      test_to:
        description: "Тест: отправить 3 первых письма на этот адрес (базу и состояние не трогает)"
        required: false
      limit:
        description: "Не больше стольких писем за запуск (пусто — по графику)"
        required: false
      mode:
        description: "send — утренняя рассылка, creators — дневная рассылка блогерам, inbox — проверка почты"
        required: false
        default: send

concurrency: outreach-mail

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Состояние рассылки
        run: |
          if git fetch origin outreach-state:outreach-state 2>/dev/null; then git worktree add .state outreach-state
          else git worktree add --orphan -b outreach-state .state; fi
      - name: Почтовые пакеты
        run: npm i --prefix .mail-deps --no-audit --no-fund nodemailer@6 imapflow@1 mailparser@3
      - name: Отправка
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OUTREACH_TG_CHAT: ${{ secrets.OUTREACH_TG_CHAT || vars.OUTREACH_TG_CHAT }}
          TEST_TO: ${{ github.event.inputs.test_to }}
          LIMIT: ${{ github.event.inputs.limit }}
          MODE: ${{ github.event.schedule == '43 13 * * 1-5' && 'creators' || github.event.inputs.mode }}
          CREATOR_OUTREACH_01: ${{ secrets.CREATOR_OUTREACH_01 }}
          CREATOR_OUTREACH_02: ${{ secrets.CREATOR_OUTREACH_02 }}
          CREATOR_OUTREACH_03: ${{ secrets.CREATOR_OUTREACH_03 }}
          CREATOR_OUTREACH_04: ${{ secrets.CREATOR_OUTREACH_04 }}
          CREATOR_OUTREACH_05: ${{ secrets.CREATOR_OUTREACH_05 }}
          CREATOR_OUTREACH_06: ${{ secrets.CREATOR_OUTREACH_06 }}
          CREATOR_OUTREACH_07: ${{ secrets.CREATOR_OUTREACH_07 }}
          CREATOR_OUTREACH_08: ${{ secrets.CREATOR_OUTREACH_08 }}
          CREATOR_OUTREACH_09: ${{ secrets.CREATOR_OUTREACH_09 }}
          CREATOR_OUTREACH_10: ${{ secrets.CREATOR_OUTREACH_10 }}
          CREATOR_OUTREACH_11: ${{ secrets.CREATOR_OUTREACH_11 }}
          CREATOR_OUTREACH_12: ${{ secrets.CREATOR_OUTREACH_12 }}
        run: |
          set -- --state .state/state.json
          [ "$MODE" = "inbox" ] && set -- "$@" --inbox
          [ "$MODE" = "creators" ] && set -- "$@" --creators
          [ -n "$TEST_TO" ] && set -- "$@" --test-to "$TEST_TO"
          [ -n "$LIMIT" ] && set -- "$@" --limit "$LIMIT"
          node scripts/outreach-mail.mjs "$@"
      - name: Сохранить состояние
        if: always() && !github.event.inputs.test_to
        run: bash scripts/save-outreach-state.sh .state
