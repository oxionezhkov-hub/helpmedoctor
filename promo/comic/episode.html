<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Приём: серия</title>
<link rel="stylesheet" href="../reel/fonts.css">
<style>
:root{--paper:#f6f4ee;--card:#fffdf8;--ink:#191c1b;--ink2:#353a38;--muted:#6b726e;--rule:#e2ddd0;--green:#0d5c55;--green-l:#5cc0b0;--soft:#dceae5;--red:#b3391f;--warn:#fbefd9;--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#world{position:absolute;inset:0}
.sbar{position:absolute;left:0;right:0;top:0;height:86px;display:flex;align-items:center;justify-content:space-between;padding:10px 64px 0 70px;font:700 34px var(--sans);z-index:6}
.sbar i{display:inline-block;width:56px;height:26px;border-radius:8px;border:3px solid var(--ink);position:relative;vertical-align:-4px}
.sbar i::after{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:60%;border-radius:3px;background:var(--ink)}
.head{position:absolute;left:24px;right:24px;top:96px;height:170px;border-radius:44px;background:var(--card);box-shadow:0 10px 30px -18px rgba(0,0,0,.25);display:flex;align-items:center;gap:26px;padding:0 34px;z-index:6}
.back{font:400 64px var(--sans);color:var(--ink2);margin-top:-8px}
.ava{position:relative;width:128px;height:128px;border-radius:50%;background:#f3dccb;overflow:hidden;flex:none}
.ava img{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.nm{font:800 44px var(--sans);white-space:nowrap} .sub{font:600 30px var(--sans);color:var(--muted);margin-top:4px;white-space:nowrap}
.mood{margin-left:auto;padding:10px 22px;border-radius:999px;font:800 28px var(--sans);background:#fde4dd;color:var(--red);white-space:nowrap}
#msgs{position:absolute;left:0;right:0;top:280px;bottom:330px;padding:0 34px 16px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.m{flex:none;overflow:hidden}
.row{display:flex;align-items:flex-end;gap:16px;margin-top:22px}
.row.dr{justify-content:flex-end}
.row .fa{width:88px;height:88px;border-radius:50%;background:#f3dccb;overflow:hidden;flex:none;position:relative}
.row .fa.m2{background:#e6dcf3}
.row .fa img{position:absolute;inset:0;width:100%;height:100%}
.bub{max-width:76%;padding:26px 34px 28px;border-radius:40px;font:600 42px/1.32 var(--sans);transform-origin:0 100%}
.bub .who{display:block;font:800 26px var(--sans);color:#7a55c0;letter-spacing:.04em;margin-bottom:4px}
.pt .bub{background:#fff;border-bottom-left-radius:12px;box-shadow:0 6px 18px -12px rgba(0,0,0,.3)}
.dr .bub{background:var(--green);color:#fbfaf6;border-bottom-right-radius:12px;transform-origin:100% 100%}
.bub.angry{background:#fff3ef;border:3px solid #f2b8a8}
.ev{margin-top:24px;border-radius:34px;background:#fff;padding:26px 30px;box-shadow:0 6px 18px -12px rgba(0,0,0,.3)}
.ev h4{font:800 34px var(--sans);display:flex;align-items:center;gap:14px}
.ev h4 small{font:600 26px var(--sans);color:var(--muted)}
.ev h4 + .r{margin-top:12px}
.ev .r{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:14px 18px;border-radius:16px;margin-top:8px;font:600 32px var(--sans)}
.ev .r > span:last-child{text-align:right}
.ev .r.bad{background:var(--warn)} .ev .r.bad b{color:var(--red)} .ev .r b{font-weight:800} .ev .r i{font-style:normal;color:var(--muted);font-size:24px;display:block;text-align:right}
.ev .sec + .sec{margin-top:20px}
.ev .note{margin-top:12px;font:600 30px/1.35 var(--sans);color:var(--ink2)}
.acts{position:absolute;left:24px;right:24px;bottom:206px;display:flex;gap:16px;z-index:5}
.chip{flex:1;height:96px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font:700 34px var(--sans);color:var(--ink2);box-shadow:0 6px 16px -12px rgba(0,0,0,.3)}
.inp{position:absolute;left:24px;right:24px;bottom:70px;height:116px;border-radius:58px;background:#fff;border:3px solid var(--rule);display:flex;align-items:center;padding:0 40px;font:600 36px var(--sans);color:#9aa19d;z-index:5}
.th{position:absolute;left:40px;right:40px;top:300px;z-index:20;opacity:0;display:flex;gap:26px;align-items:center;padding:30px 36px;border-radius:44px;background:rgba(25,28,27,.93);color:#fff;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.th .df{width:130px;height:130px;border-radius:50%;background:#bfe6dd;overflow:hidden;flex:none;position:relative}
.th .df img{position:absolute;inset:0;width:100%;height:100%}
.th .lb{font:800 26px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--green-l);margin-bottom:8px}
.th .tx{font:700 44px/1.25 var(--sans);font-style:italic}
.th::after{content:"";position:absolute;left:120px;bottom:-34px;width:34px;height:34px;border-radius:50%;background:rgba(25,28,27,.93)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;border-radius:56px 56px 0 0;background:#fff;padding:40px 40px 120px;box-shadow:0 -30px 80px -30px rgba(0,0,0,.4);transform:translateY(110%)}
.sheet h3{font:800 46px var(--sans);margin-bottom:30px;display:flex;align-items:center;gap:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.opt{min-height:118px;border-radius:30px;background:#f1efe8;display:flex;align-items:center;padding:14px 30px;font:700 34px/1.2 var(--sans);border:4px solid transparent}
.opt.on{border-color:var(--green);background:var(--soft)}
.fld{border:3px solid var(--rule);border-radius:28px;padding:22px 28px;font:600 38px/1.3 var(--sans);min-height:100px;margin-bottom:24px}
.fld.dx{border-color:var(--green)}
.lbl{font:700 28px var(--sans);color:var(--muted);margin:0 0 10px 6px}
.go{height:116px;border-radius:30px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font:800 40px var(--sans)}
.stamp{position:absolute;right:60px;top:40px;padding:10px 30px 14px;border:8px solid var(--green);border-radius:20px;color:var(--green);font:800 56px var(--sans);transform:rotate(-10deg);opacity:0;background:rgba(220,234,229,.7)}
#dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.55));opacity:0;z-index:12;pointer-events:none}
#glow{position:absolute;inset:0;z-index:30;pointer-events:none}
.tap{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;opacity:0;z-index:40}
.tap i{position:absolute;inset:26px;border-radius:50%;background:rgba(13,92,85,.35);border:5px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tap s{position:absolute;inset:0;border-radius:50%;border:6px solid rgba(13,92,85,.55)}
.meme{position:absolute;left:50%;top:300px;z-index:35;transform:translateX(-50%);padding:18px 36px 22px;border-radius:24px;background:#fff;font:800 50px/1.15 var(--sans);text-align:center;box-shadow:0 20px 50px -18px rgba(0,0,0,.45);opacity:0;max-width:1000px}
.emo{position:absolute;width:200px;height:200px;z-index:36;opacity:0}
.emo img{width:100%;height:100%}
#hearts i{position:absolute;width:90px;height:90px;z-index:36;opacity:0;background:url(emoji/2764.svg) center/contain no-repeat}
.typing{display:inline-flex;gap:12px;padding:30px 34px}
.typing i{width:20px;height:20px;border-radius:50%;background:#9aa19d}
.ej{width:1.05em;height:1.05em;vertical-align:-0.15em;display:inline-block}
</style></head>
<body>
<div id="stage"><div id="world">
  <div class="sbar"><span>9:41</span><span>5G <i></i></span></div>
  <div class="head"><div class="back">‹</div>
    <div class="ava" id="ava"></div>
    <div><div class="nm" id="nm"></div><div class="sub" id="sub"></div></div>
    <div class="mood" id="mood"></div></div>
  <div id="msgs"></div>
  <div class="acts"><div class="chip" id="c-tests"><img class="ej" src="emoji/1f9ea.svg"> Анализы</div><div class="chip" id="c-exam"><img class="ej" src="emoji/1fa7a.svg"> Осмотр</div><div class="chip" id="c-fin"><img class="ej" src="emoji/1f3c1.svg"> Завершить</div></div>
  <div class="inp">Спросите пациента…</div>
  <div id="dim"></div>
  <div id="sheets"></div>
</div>
  <div id="thoughts"></div>
  <div id="taps"></div>
  <div class="meme" id="meme1"></div>
  <div class="meme" id="meme2" style="top:640px;font-size:62px;white-space:nowrap"></div>
  <div id="emos"></div>
  <div id="hearts"></div>
  <div id="glow"></div>
</div>
<script>
// Серия комичного приёма: всё берётся из timeline.json (реплики episode.json + тайминги озвучки).
// Реплика может нести: face, angry, sheet {type, opts, pick}, card {secs, note}, finish {dx, tx}, drama N, emoji, ding, hearts, mood.
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)); const eout = (x) => 1 - Math.pow(1 - x, 3); const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// настроение по выражению лица: [текст для женщины, для мужчины, фон, цвет]
const MOOD = {
  rage: ['в ярости', 'в ярости', '#fde4dd', '#b3391f'], veryAngry: ['злится', 'злится', '#fde4dd', '#b3391f'], angryWithFang: ['злится', 'злится', '#fde4dd', '#b3391f'],
  hectic: ['в панике', 'в панике', '#fbefd9', '#92400e'], fear: ['в панике', 'в панике', '#fbefd9', '#92400e'], concernedFear: ['боится', 'боится', '#fbefd9', '#92400e'],
  concerned: ['переживает', 'переживает', '#fbefd9', '#92400e'], suspicious: ['подозревает', 'подозревает', '#fbefd9', '#92400e'],
  explaining: ['объясняет', 'объясняет', '#e5eef8', '#1e4f8a'], calm: ['спокойна', 'спокоен', '#dceae5', '#0d5c55'], blank: ['невозмутима', 'невозмутим', '#eceae4', '#4b524e'],
  serious: ['серьёзна', 'серьёзен', '#eceae4', '#4b524e'], tired: ['устала', 'устал', '#eceae4', '#4b524e'], smile: ['довольна', 'доволен', '#dceae5', '#0d5c55'],
  smileBig: ['сияет', 'сияет', '#dceae5', '#0d5c55'], smileTeethGap: ['хитрит', 'хитрит', '#dceae5', '#0d5c55'], awe: ['в шоке', 'в шоке', '#e9e4f7', '#5b3fb0'],
  lovingGrin1: ['в восторге', 'в восторге', '#fde4ee', '#b3245c'], cute: ['умиляется', 'умиляется', '#fde4ee', '#b3245c'],
};
let TL, L, M, DIR, FIN = -1; const ITEMS = [], SHEETS = [], EMOS = [], TAPS = [], HEARTS = [];
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
const ej = (c) => `<img class="ej" src="emoji/${c}.svg">`;
function cardHtml(c) {
  return `<div class="m"><div class="ev">` + c.secs.map((s) => `<div class="sec"><h4>${ej(s.icon)} ${s.title} ${s.sub ? `<small>${s.sub}</small>` : ''}</h4>` +
    s.rows.map(([k, v, n, bad]) => `<div class="r${bad ? ' bad' : ''}"><span>${k}</span><span><b>${v}</b>${n ? `<i>${n}</i>` : ''}</span></div>`).join('') + `</div>`).join('') +
    (c.note ? `<div class="note">${c.note}</div>` : '') + `</div></div>`;
}
function init(tl, dir) {
  TL = tl; L = tl.lines; M = tl.meta; DIR = dir;
  const P = M.cast.p; document.getElementById('nm').textContent = P.name; document.getElementById('sub').textContent = P.sub;
  // лица пациента в шапке
  const pf = new Set([P.face0, ...L.filter((l) => l.who === 'p' && l.face).map((l) => l.face)]);
  const ava = document.getElementById('ava');
  pf.forEach((f) => { const im = document.createElement('img'); im.src = `${DIR}/faces/p-${f}.svg`; im.dataset.f = f; ava.appendChild(im); });
  const msgs = document.getElementById('msgs'), sheets = document.getElementById('sheets');
  const face = { p: P.face0, m: M.cast.m?.face0 }; let lastBub = null, firstP = true;
  L.forEach((l, i) => {
    if (l.face && (l.who === 'p' || l.who === 'm')) face[l.who] = l.face;
    if (l.card) { const c = el(cardHtml(l.card)); msgs.appendChild(c); ITEMS.push({ node: c, a: l.start - 0.35 }); l.cardAt = l.start - 0.35; }
    if (l.who === 't') return;
    if (l.cont) { lastBub.extra = lastBub.extra || []; lastBub.extra.push({ at: l.start, text: ' ' + l.text }); return; }
    if (l.who === 'p' || l.who === 'm') {
      const fa = `<div class="fa${l.who === 'm' ? ' m2' : ''}"><img src="${DIR}/faces/${l.who}-${face[l.who]}.svg"></div>`;
      const ty = el(`<div class="m"><div class="row pt">${fa}<div class="bub typing"><i></i><i></i><i></i></div></div></div>`);
      msgs.appendChild(ty); ITEMS.push({ node: ty, a: Math.max(0, l.start - 0.55), b: l.start, typing: true });
      const tag = l.who === 'm' ? `<span class="who">${M.cast.m.name}</span>` : '';
      const node = el(`<div class="m"><div class="row pt">${fa}<div class="bub ${l.angry ? 'angry' : ''}">${tag}${l.text}</div></div></div>`);
      msgs.appendChild(node); lastBub = { node, a: l.start - 0.05 }; ITEMS.push(lastBub);
    } else {
      const node = el(`<div class="m"><div class="row dr"><div class="bub">${l.text}<span class="x"></span></div></div></div>`);
      msgs.appendChild(node); lastBub = { node, a: l.start - 0.05 }; ITEMS.push(lastBub);
    }
  });
  // шторки обследований и осмотра
  L.forEach((l, i) => {
    if (l.sheet) {
      const s = l.sheet, ex = s.type === 'exam';
      const n = el(`<div class="sheet"><h3>${ej(ex ? '1fa7a' : '1f9ea')} ${ex ? 'Физический осмотр' : 'Назначить обследование'}</h3><div class="grid">${s.opts.map((o) => `<div class="opt">${o}</div>`).join('')}</div></div>`);
      sheets.appendChild(n);
      const a = l.start + 0.3, picks = s.pick.map((p, k) => ({ el: n.querySelectorAll('.opt')[p], t: l.start + 0.75 + k * 0.55 }));
      const b = Math.max(L[i + 1] ? L[i + 1].start + 0.2 : l.end + 0.5, picks.at(-1).t + 0.5);
      SHEETS.push({ n, a, b, picks, chip: ex ? 'c-exam' : 'c-tests', tap: l.start + 0.1 });
    }
    if (l.finish) {
      FIN = i;
      const n = el(`<div class="sheet"><h3>${ej('1f3c1')} Завершить приём</h3><div class="lbl">Диагноз</div><div class="fld dx"></div><div class="lbl">Лечение</div><div class="fld tx"></div>
        <div class="go">Поставить диагноз и завершить</div><div class="stamp">ВЕРНО ✓</div></div>`);
      sheets.appendChild(n);
      const fa = l.start + 0.3, fdx = fa + Math.min(1.8, 0.05 * l.finish.dx.length), fb = Math.max(l.end, fdx + 1.6);
      const b = Math.max(L[i + 1] ? L[i + 1].start + 0.4 : fb + 0.8, fb + 0.8);
      SHEETS.push({ n, a: l.start, b, fin: { ...l.finish, fa, fdx, fb }, chip: 'c-fin', tap: l.start - 0.2 });
    }
    if (l.emoji) {
      const n = el(`<div class="emo" style="left:${820 - (EMOS.length % 2) * 30}px;top:300px"><img src="emoji/${l.emoji}.svg"></div>`);
      document.getElementById('emos').appendChild(n);
      EMOS.push({ n, a: l.start, b: (L[i + 1] ? L[i + 1].end : l.end) + 1 });
    }
  });
  // мысли врача
  const th = document.getElementById('thoughts');
  L.forEach((l) => { if (l.who !== 't') return; const n = el(`<div class="th"><div class="df"><img src="faces/${l.face || 'doc-suspicious'}.svg"></div><div><div class="lb">${ej('1f4ad')} мысли врача</div><div class="tx">${l.text}</div></div></div>`); th.appendChild(n); l.node = n; });
  // тапы
  const pos = (e) => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  const addTap = (p, t) => { const n = el('<div class="tap"><s></s><i></i></div>'); document.getElementById('taps').appendChild(n); TAPS.push({ n, p, t }); };
  SHEETS.forEach((s) => { addTap(pos(document.getElementById(s.chip)), s.tap);
    (s.picks || []).forEach((pk) => { s.n.style.transform = 'translateY(0)'; addTap(pos(pk.el), pk.t); s.n.style.transform = ''; }); });
  // хук и финал
  document.getElementById('meme1').textContent = M.hook.meme; document.getElementById('meme2').textContent = M.final;
  const he = el(`<div class="emo" style="left:780px;top:560px"><img src="emoji/${M.hook.emoji}.svg"></div>`); document.getElementById('emos').appendChild(he); window.HOOKE = he;
  // сердечки
  const hl = L.findIndex((l) => l.hearts); window.HUG = hl;
  if (hl >= 0) { const H = document.getElementById('hearts'); for (let k = 0; k < 14; k++) { const n = document.createElement('i'); H.appendChild(n); HEARTS.push({ n, x: 120 + (k * 137) % 840, d: (k % 5) * 0.12, s: 0.7 + (k % 3) * 0.25 }); } }
  return Promise.all([...document.images].map((im) => im.decode().catch(() => console.error('img fail ' + im.src))));
}
function seek(t) {
  ITEMS.forEach((it) => {
    const k = it.typing ? (t >= it.a && t < it.b ? 1 : 0) : eout(clamp((t - it.a) / 0.35));
    it.node.style.maxHeight = it.typing ? (k ? '200px' : '0px') : (k * 1200) + 'px';
    it.node.style.opacity = it.typing ? k : clamp((t - it.a) / 0.2);
    const bub = it.node.querySelector('.bub'); if (bub && !it.typing) bub.style.transform = `scale(${0.85 + 0.15 * eout(clamp((t - it.a) / 0.3))})`;
    if (it.extra) it.node.querySelector('.x').textContent = it.extra.filter((e) => t >= e.at).map((e) => e.text).join('');
  });
  // лицо и настроение пациента
  const P = M.cast.p; let face = P.face0, mood = null;
  L.forEach((l) => { if (l.who === 'p' && t >= l.start - 0.1) { if (l.face) face = l.face; mood = l.mood || null; } });
  document.querySelectorAll('#ava img').forEach((im) => (im.style.opacity = im.dataset.f === face ? 1 : 0));
  const md = MOOD[face] || MOOD.calm, me = document.getElementById('mood');
  me.textContent = mood || (P.g === 'm' ? md[1] : md[0]); me.style.background = md[2]; me.style.color = md[3];
  // мысли
  L.forEach((l) => { if (!l.node) return; const k = eout(clamp((t - l.start + 0.25) / 0.35)), out = clamp((l.end + 0.5 - t) / 0.3);
    const o = t < l.start - 0.25 ? 0 : k * (l === L.at(-1) ? 1 : out); l.node.style.opacity = o; l.node.style.transform = `translateY(${(1 - k) * -30}px) scale(${0.95 + 0.05 * k})`; });
  // шторки
  SHEETS.forEach((s) => {
    const k = ease(clamp((t - s.a) / 0.35)) * (1 - ease(clamp((t - s.b) / 0.35))); s.n.style.transform = `translateY(${(1 - k) * 110}%)`;
    (s.picks || []).forEach((pk) => pk.el.classList.toggle('on', t > pk.t + 0.1));
    if (s.fin) { const f = s.fin, typ = (x, a, b) => x.slice(0, Math.round(x.length * clamp((t - a) / (b - a))));
      s.n.querySelector('.dx').textContent = typ(f.dx, f.fa, f.fdx); s.n.querySelector('.tx').textContent = typ(f.tx, f.fdx, f.fb);
      const sk = clamp((t - f.fb) / 0.25), st = s.n.querySelector('.stamp'); st.style.opacity = sk; st.style.transform = `rotate(-10deg) scale(${2 - sk})`; }
  });
  // тапы
  TAPS.forEach((tp) => { const d = t - tp.t + 0.35; if (d < 0 || d > 0.8) { tp.n.style.opacity = 0; return; }
    tp.n.style.left = tp.p.x + 'px'; tp.n.style.top = tp.p.y + 'px'; tp.n.style.opacity = clamp(d / 0.15) * clamp((0.8 - d) / 0.2);
    const press = clamp((d - 0.25) / 0.12) * (1 - clamp((d - 0.42) / 0.12)); tp.n.querySelector('i').style.transform = `scale(${1 - press * .25})`;
    const r = clamp((d - 0.3) / 0.45); tp.n.querySelector('s').style.transform = `scale(${0.6 + r})`; tp.n.querySelector('s').style.opacity = d > .3 ? 1 - r : 0; });
  // хук: тряска и цветная вспышка; драма: затемнение и наезд
  let sx = 0, sy = 0; const shake = (t0, A) => { const d = t - t0; if (d >= 0 && d < 0.5) { const k = A * Math.exp(-d / 0.12); sx += k * Math.sin(d * 85); sy += k * Math.cos(d * 70); } };
  shake(0.25, 22); shake(1.4, 12);
  let dk = 0;
  L.forEach((l, i) => { if (!l.drama) return; const e = L[i + l.drama] ? L[i + l.drama].start + 0.1 : l.end + 1;
    dk = Math.max(dk, clamp((t - l.start) / 0.4) * (1 - clamp((t - e) / 0.25))); });
  document.getElementById('dim').style.opacity = Math.max(dk, 0.8 * clamp((t - L.at(-1).end) / 0.3));
  document.getElementById('world').style.transform = `translate(${sx}px,${sy}px) scale(${1 + 0.06 * dk})`;
  const rg = Math.max(0, 1 - t / 1.6), gc = M.hook.glow || '#dc2814';
  document.getElementById('glow').style.boxShadow = `inset 0 0 ${120 * rg}px ${40 * rg}px ${gc}${Math.round(0x73 * rg).toString(16).padStart(2, '0')}`;
  // мемы и эмодзи
  const m1 = document.getElementById('meme1'); const k1 = clamp(t / 0.25) * clamp((3.2 - t) / 0.3); m1.style.opacity = k1; m1.style.transform = `translateX(-50%) rotate(-2deg) scale(${0.9 + 0.1 * k1})`;
  const last = L.at(-1), m2 = document.getElementById('meme2'), k2 = eout(clamp((t - last.end - 0.05) / 0.3)); m2.style.opacity = k2; m2.style.transform = `translateX(-50%) rotate(-3deg) scale(${1.3 - 0.3 * k2})`;
  const ke = clamp((t - 0.3) / 0.25) * clamp((3 - t) / 0.3); HOOKE.style.opacity = ke; HOOKE.style.transform = `scale(${0.5 + 0.5 * eout(clamp((t - 0.3) / 0.3))}) rotate(${Math.sin(t * 12) * 8}deg)`;
  EMOS.forEach((e) => { const k = eout(clamp((t - e.a) / 0.3)) * clamp((e.b - t) / 0.3); e.n.style.opacity = t < e.a ? 0 : k; e.n.style.transform = `scale(${0.4 + 0.6 * k}) rotate(${-10 + Math.sin(t * 8) * 6}deg)`; });
  if (HUG >= 0) HEARTS.forEach((h) => { const d = t - L[HUG].start - h.d; if (d < 0) { h.n.style.opacity = 0; return; }
    const y = 1500 - d * 520, o = clamp(d / 0.2) * clamp((3.2 - d) / 0.6); h.n.style.opacity = o; h.n.style.transform = `translate(${h.x + Math.sin(d * 3 + h.x) * 30}px,${y}px) scale(${h.s})`; });
}
window.init = init; window.seek = seek;
window.events = () => {
  const ev = [{ t: 0.2, type: 'boom' }, { t: L.at(-1).end + 0.05, type: 'rimshot' }];
  L.forEach((l, i) => {
    if (l.who === 't') ev.push({ t: l.start - 0.25, type: 'think' }); else if (!l.cont) ev.push({ t: l.start - 0.05, type: l.who === 'd' ? 'pop_d' : 'pop_p' });
    if (l.cardAt) ev.push({ t: l.cardAt, type: 'card' });
    if (l.drama) ev.push({ t: l.start, type: 'drama' }, { t: L[i + l.drama] ? L[i + l.drama].start + 0.1 : l.end + 1, type: 'drama_end' });
    if (l.ding) ev.push({ t: l.start, type: 'ding' });
    if (l.hearts) ev.push({ t: l.start, type: 'love' });
  });
  SHEETS.forEach((s) => { ev.push({ t: s.a, type: 'sheet' }); if (s.fin) ev.push({ t: s.fin.fb, type: 'stamp' }); });
  TAPS.forEach((tp) => ev.push({ t: tp.t, type: 'tap' }));
  return ev.sort((a, b) => a.t - b.t);
};
