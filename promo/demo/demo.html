<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Help me, Doctor — демо</title>
<link rel="stylesheet" href="../reel/fonts.css">
<style>
:root{
  --paper:#f6f4ee; --paper2:#eeebe2; --card:#fffdf8; --ink:#191c1b; --ink2:#353a38; --muted:#5f6662; --rule:#dcd7ca;
  --green:#0d5c55; --green-l:#5cc0b0; --green-soft:#dceae5; --red:#b3391f; --mark:#f4e4a1;
  --sans:"Manrope",system-ui,sans-serif; --serif:"Literata",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(1200px 900px at 85% 10%,#e3efe9 0%,transparent 60%),radial-gradient(1000px 900px at 0% 95%,#f3e6d6 0%,transparent 60%),var(--paper)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(25,28,27,.07) 1.5px,transparent 1.6px);background-size:36px 36px;mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}

/* headline */
#head{position:absolute;left:60px;right:60px;top:96px;height:270px}
#head .h{position:absolute;inset:0;opacity:0}
.step{display:inline-flex;align-items:center;gap:14px;padding:10px 24px 12px 12px;border-radius:999px;background:var(--card);border:2px solid var(--rule);font:800 30px var(--sans);color:var(--green);box-shadow:0 6px 20px -12px rgba(0,0,0,.25)}
.step b{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;padding:0 10px;border-radius:999px;background:var(--green);color:#fff;font-size:26px}
.title{margin-top:22px;font:700 72px/1.04 var(--serif);letter-spacing:-.02em;color:var(--ink)}
.title em{font-style:normal;color:var(--green)}

/* phone */
#phone{position:absolute;left:220px;top:318px;width:640px;height:1425px;border-radius:72px;background:#16191a;padding:14px;
  box-shadow:0 60px 120px -40px rgba(20,40,35,.45),0 20px 40px -20px rgba(0,0,0,.25),inset 0 0 0 2px #2d3234}
#screen{position:relative;width:612px;height:1397px;border-radius:58px;overflow:hidden;background:#f6f4ee}
#cam{position:absolute;left:0;top:72px;width:612px;height:1325px;transform-origin:0 0;background:#f6f4ee}
#cam img{position:absolute;left:0;top:0;width:612px;height:1325px;opacity:0}
.sbar{position:absolute;left:0;right:0;top:0;height:72px;background:#f6f4ee;display:flex;align-items:center;justify-content:space-between;padding:8px 46px 0 52px;font:700 27px var(--sans);color:var(--ink);z-index:2}
.sbar i{display:inline-block;width:44px;height:21px;border-radius:6px;border:2.5px solid var(--ink);position:relative}
.sbar i::after{content:"";position:absolute;left:3px;top:3px;bottom:3px;width:70%;border-radius:2px;background:var(--ink)}
.notch{position:absolute;left:50%;top:16px;width:150px;height:40px;margin-left:-75px;border-radius:20px;background:#16191a;z-index:5}

/* tap */
.tap{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;opacity:0;z-index:20;pointer-events:none}
.tap i{position:absolute;inset:22px;border-radius:50%;background:rgba(13,92,85,.35);border:4px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tap s{position:absolute;inset:0;border-radius:50%;border:5px solid rgba(13,92,85,.55)}

/* tooltips */
.tip{position:absolute;inset:0;z-index:30;opacity:0;pointer-events:none}
.tip .box{position:absolute;width:max-content;max-width:350px;padding:18px 24px 20px;border-radius:24px;background:#fff;box-shadow:0 24px 60px -20px rgba(20,40,35,.45),0 0 0 2px rgba(13,92,85,.12);font:800 31px/1.18 var(--sans);color:var(--ink);white-space:normal}
.tip .box small{display:block;font:600 24px/1.25 var(--sans);color:var(--muted);margin-top:6px}
.tip .box::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:7px;border-radius:0 6px 6px 0;background:var(--green)}
.tip .dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--green);border:5px solid #fff;box-shadow:0 0 0 6px rgba(13,92,85,.25)}
.tip svg{position:absolute;left:0;top:0;overflow:visible}
.tip svg path{fill:none;stroke:var(--green);stroke-width:4;stroke-dasharray:7 8;stroke-linecap:round}

/* captions */
#cap{position:absolute;left:40px;right:40px;top:1780px;height:110px;display:flex;align-items:center;justify-content:center;text-align:center}
#cap .ln{display:inline-block;padding:12px 26px 16px;border-radius:22px;background:rgba(25,28,27,.88);font:700 38px/1.25 var(--sans);color:#fff}
#cap .w{display:inline-block;margin:0 .12em}
#cap .w.on{color:var(--mark)}

/* progress */
#prog{position:absolute;left:60px;right:60px;top:44px;height:8px;border-radius:4px;background:rgba(25,28,27,.08);overflow:hidden}
#prog i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:4px}

/* intro + cta overlays */
#intro{position:absolute;inset:0;z-index:40;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:16px;font:800 34px var(--sans);color:var(--ink)}
.logo{width:74px;height:74px;border-radius:20px;background:var(--card);border:5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.logo svg{width:56px;height:56px}
.logo path{fill:none;stroke:var(--red);stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
#cta{position:absolute;left:0;right:0;top:1440px;z-index:40;opacity:0;text-align:center}
#cta .url{display:inline-block;padding:22px 52px 26px;border-radius:999px;background:var(--green);color:#fff;font:800 58px var(--sans);box-shadow:0 26px 60px -20px rgba(13,92,85,.7)}
#cta .sub{display:inline-block;margin-top:18px;padding:10px 26px 12px;border-radius:999px;background:#fff;font:700 32px var(--sans);color:var(--ink2);box-shadow:0 10px 30px -14px rgba(0,0,0,.3)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:50;pointer-events:none}
</style></head>
<body>
<div id="stage">
  <div class="dots"></div>
  <div id="prog"><i id="progbar"></i></div>
  <div id="head"></div>
  <div id="phone"><div id="screen"><div id="cam"></div><div class="sbar"><span>9:41</span><span style="display:flex;gap:10px;align-items:center">5G <i></i></span></div><div class="notch"></div></div></div>
  <div id="taps"></div>
  <div id="tips"></div>
  <div id="cta"><div class="url">helpmedoctor.ru</div><div class="sub">или бот @helpmedoctor_aibot в Telegram</div></div>
  <div id="cap"></div>
  <div id="flash"></div>
</div>
<script>
// ---------- раскадровка: сцены ↔ фразы озвучки, кадры реального приложения, подсказки ----------
// tips: [x, y] — точка на экране в CSS-пикселях телефона (390×844), side — где карточка

  intro:   { step: '', title: 'Тренажёр врача с <em>ИИ‑пациентами</em>', small: true, shots: [{ f: '68-home-after', w: 1, tips: [{ y: 110, side: 'l', t: 'Ваш уровень и прогресс' }, { y: 410, side: 'r', t: 'Новый пациент в один клик', at: .45 }] }] },
  onb:     { step: 1, title: 'Выбираем <em>специальность</em>', shots: [

    { f: '04-onb-2-tap', w: .9, tips: [{ y: 192, side: 'r', t: 'Специальность' }] },

  patient: { step: 2, title: 'Приходит <em>новый пациент</em>', shots: [

    { f: '25-test-blood-result', w: 1.6, zoom: { s: 1.1, x: 195, y: 440 }, tips: [{ y: 393, side: 'l', t: 'Гемоглобин снижен' }, { y: 485, side: 'r', t: 'СОЭ повышена', at: .35 }] } ] },

    { f: '28-q3-answer', w: 1.4, zoom: { s: 1.1, x: 195, y: 520 }, tips: [{ y: 576, side: 'l', t: 'Вот и причина: НПВС' }] },
    { f: '29-q4-typed', w: .4 }, { f: '31-q4-answer', w: .8 } ] },
  exam:    { step: 6, title: 'Проводим <em>осмотр</em>', shots: [

    { f: '35-exam-result', w: 1.3, zoom: { s: 1.1, x: 195, y: 560 }, tips: [{ y: 562, side: 'l', t: 'Находка при пальпации' }] } ] },
  finish:  { step: 7, title: 'Диагноз и <em>лечение</em>', shots: [
    { f: '36-finish-tap', w: .4 }, { f: '37-finish-sheet', w: .5, tips: [{ y: 452, side: 'r', t: 'Диагноз, направление или отказ' }] },
    { f: '38-finish-dx', w: .8, tips: [{ y: 525, side: 'l', t: 'Ваш диагноз' }] }, { f: '39-finish-tx', w: 1, tips: [{ y: 610, side: 'r', t: 'Схема лечения' }] } ] },
  eval:    { step: 8, title: 'Оценка <em>эксперта</em>', shots: [

    { f: '42-eval-scroll-1', w: .9, tips: [{ y: 247, side: 'r', t: 'Опыт и новый уровень' }] } ] },
  kr:      { step: 9, title: 'Разбор по КР <em>Минздрава</em>', shots: [
    { f: '81-kr-cta', w: .5 }, { f: '82-kr-pending', w: .4, tips: [{ y: 225, side: 'r', t: 'Сверяем с рекомендациями' }] },
    { f: '83-kr-guide-1', w: 1.2, tips: [{ y: 113, side: 'r', t: 'Ссылка на КР Минздрава' }, { y: 265, side: 'l', t: 'Что обязательно по КР', at: .4 }] },
    { f: '84-kr-guide-2', w: 1.1, tips: [{ y: 165, side: 'r', t: 'Препараты по МНН и дозы' }, { y: 400, side: 'l', t: 'Красные флаги', at: .45 }] } ] },
  quiz:    { step: 10, title: 'Тест по <em>вашим ошибкам</em>', shots: [
    { f: '52-quiz-q1', w: .5, tips: [{ y: 207, side: 'l', t: '5 вопросов по этому приёму' }] }, { f: '53-quiz-q1-tap', w: .3 }, { f: '54-quiz-q1-answered', w: .6 },

    { f: '62-quiz-q3', w: .3 }, { f: '64-quiz-q3-answered', w: .5 } ] },

    { f: '71-stats-2', w: 1, tips: [{ y: 470, side: 'r', t: 'Сильные стороны и пробелы' }] } ] },
  battle:  { step: 12, title: 'Битва с <em>одногруппником</em>', shots: [
    { f: '88-battles-empty', w: .8, tips: [{ y: 95, side: 'l', t: 'Один пациент на двоих' }] },
    { f: '90-battle-joined', w: .5 }, { f: '91-battle-result', w: 1.4, tips: [{ y: 255, side: 'r', t: 'Победа!' }, { y: 400, side: 'l', t: 'Оценка, диагноз, время', at: .35 }] } ] },
  cta:     { step: '', title: 'Попробуйте <em>бесплатно</em>', shots: [
    { f: '99-login', w: 1, tips: [{ y: 410, side: 'l', t: 'Вход в один клик' }, { y: 456, side: 'r', t: 'Telegram, Яндекс или Google', at: .3 }] } ] },
};
let TL, META = {}, PLAN = [], CH = [];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = (x) => 1 - Math.pow(1 - x, 3);
const SX = 234, SY = 332 + 72, K = 612 / 390;            // экран телефона в кадре, масштаб CSS→кадр
function init(tl, meta) {
  TL = tl; meta.forEach((m) => (META[m.file.replace('.png', '').replace(/^\d+-/, '')] = m));
  const cam = document.getElementById('cam'), head = document.getElementById('head');
  const lines = TL.lines;
  const rep = (x) => Object.entries(TL.replace || {}).reduce((s, [a, b]) => s.split(a).join(b), x);  // «вы» → «ты» и т. п.
  const NSTEP = lines.filter((l) => SCENES[l.key].step !== '').length; let step = 0;
  lines.forEach((l, i) => {
    const base = SCENES[l.key];  // l.only — оставить только эти кадры (короткая сцена), l.title — свой заголовок
    const sc = { ...base, step: base.step === '' ? '' : ++step, title: rep(l.title || base.title),
      shots: (l.only ? base.shots.filter((x) => l.only.includes(x.f)) : base.shots).map((x) => ({ ...x, tips: (x.tips || []).map((tp) => ({ ...tp, t: rep(tp.t), s: tp.s && rep(tp.s) })) })) };
    const a = i === 0 ? 0 : l.start - 0.45, b = i + 1 < lines.length ? lines[i + 1].start - 0.45 : TL.total;
    const W = sc.shots.reduce((s, x) => s + x.w, 0);
    let t = a;
    const h = document.createElement('div'); h.className = 'h'; h.innerHTML = (sc.step !== '' ? `<div class="step"><b>${sc.step}</b>шаг из ${NSTEP}</div>` : `<div class="badge"><div class="logo"><svg viewBox="96 96 320 320"><path d="M136 270h66l29-66 47 132 31-66h75"/></svg></div>Help me, Doctor</div>`) + `<div class="title"${sc.small ? ' style="font-size:54px;white-space:nowrap"' : ''}>${sc.title}</div>`;
      head.appendChild(h);
    sc.shots.forEach((s) => {
      const d = (b - a) * s.w / W;
      const img = document.createElement('img'); img.src = 'shots/' + s.f + '.png'; cam.appendChild(img);
      const key = s.f.replace(/^\d+-/, '');
      PLAN.push({ ...s, a: t, b: t + d, img, scene: l.key, sceneA: a, sceneB: b, head: h, tap: META[key]?.tap });
      t += d;
    });
  });
  // подсказки
  const tips = document.getElementById('tips');
  PLAN.forEach((s) => (s.tips || []).forEach((tp) => {
    const el = document.createElement('div'); el.className = 'tip';
    el.innerHTML = `<svg width="1" height="1"><path/></svg><div class="dot"></div><div class="box">${tp.t}${tp.s ? `<small>${tp.s}</small>` : ''}</div>`;
    if (!tp.keep) tp.x = tp.side === 'r' ? 374 : 16;
    tips.appendChild(el); tp.el = el; tp.t0 = s.a + (s.b - s.a) * (tp.at || 0) + 0.25; tp.t1 = s.b + (s === PLAN.at(-1) ? 9 : 0.05);
  }));
  // тапы
  const taps = document.getElementById('taps');
  PLAN.forEach((s) => { if (s.tap) { const el = document.createElement('div'); el.className = 'tap'; el.innerHTML = '<s></s><i></i>'; taps.appendChild(el); s.tapEl = el; } });
  // субтитры
  lines.forEach((l) => { let cur = []; l.words.forEach((w, i) => { cur.push(w); const gap = i + 1 < l.words.length ? l.words[i + 1][0] - (w[0] + w[1]) : 9;
    if (cur.length >= 5 || gap > 0.22 || i === l.words.length - 1) { CH.push({ words: cur, start: cur[0][0], end: i + 1 < l.words.length ? Math.min(l.words[i + 1][0], w[0] + w[1] + 0.4) : w[0] + w[1] + 0.4 }); cur = []; } }); });
  return Promise.all([...cam.querySelectorAll('img')].map((im) => im.decode().catch(() => console.error('img fail ' + im.src))));
}
function camAt(t) {
  // текущий зум камеры: плавно к цели кадра
  let z = { s: 1, x: 195, y: 422 };
  for (const s of PLAN) {
    if (t < s.a) break;
    const target = s.zoom || { s: 1, x: 195, y: 422 };
    const k = ease(clamp((t - s.a) / 0.7));
    z = { s: z.s + (target.s - z.s) * k, x: z.x + (target.x - z.x) * k, y: z.y + (target.y - z.y) * k };
  }
  return z;
}
function toFrame(x, y, z) {
  // точка экрана (CSS) → кадр, с учётом зума вокруг (z.x, z.y)
  const ox = z.x * K, oy = z.y * K + 70 - 70;
  return [SX + ox + (x * K - ox) * z.s, SY + oy + (y * K - oy) * z.s];
}
function seek(t) {
  const z = camAt(t);
  const ox = z.x * K, oy = z.y * K;
  document.getElementById('cam').style.transform = `translate(${ox}px,${oy}px) scale(${z.s}) translate(${-ox}px,${-oy}px)`;
  // кадры: перекрёстная смена 0,22 с
  PLAN.forEach((s, i) => {
    let o = 0;
    if (t >= s.a && t < s.b) o = 1;
    else if (i + 1 < PLAN.length && t >= s.b && t < s.b + 0.22) o = 1;
    if (t >= s.a && t < s.a + 0.22 && i > 0) o = clamp((t - s.a) / 0.22);
    s.img.style.opacity = o; s.img.style.zIndex = i;
  });
  // заголовки
  let curHead = null;
  PLAN.forEach((s) => { if (t >= s.sceneA && t < s.sceneB) curHead = s; });
  document.querySelectorAll('#head .h').forEach((h) => { h.style.opacity = 0; });
  if (curHead) { const k = eout(clamp((t - curHead.sceneA) / 0.5)), out = clamp((curHead.sceneB - t) / 0.3); curHead.head.style.opacity = k * out; curHead.head.style.transform = `translateY(${(1 - k) * 30}px)`; }
  // тапы: палец появляется за 0,55 с до конца кадра, нажатие
  PLAN.forEach((s) => { if (!s.tapEl) return; const d = t - (s.b - 0.55); if (d < 0 || d > 0.75) { s.tapEl.style.opacity = 0; return; }
    const [X, Y] = toFrame(s.tap.x, s.tap.y, z); s.tapEl.style.left = X + 'px'; s.tapEl.style.top = Y + 'px';
    const press = clamp((d - 0.25) / 0.15) * (1 - clamp((d - 0.45) / 0.15));
    s.tapEl.style.opacity = clamp(d / 0.15) * clamp((0.75 - d) / 0.2);
    s.tapEl.querySelector('i').style.transform = `scale(${1 - press * 0.25})`;
    const r = clamp((d - 0.3) / 0.45); s.tapEl.querySelector('s').style.transform = `scale(${0.6 + r * 0.9})`; s.tapEl.querySelector('s').style.opacity = d > 0.3 ? 1 - r : 0; });
  // подсказки
  PLAN.forEach((s) => (s.tips || []).forEach((tp) => {
    const el = tp.el; const k = eout(clamp((t - tp.t0) / 0.35)), out = clamp((tp.t1 - t) / 0.25);
    const o = t < tp.t0 ? 0 : k * out; el.style.opacity = o; if (o <= 0) return;
    const [X, Y] = toFrame(tp.x, tp.y, z);
    const box = el.querySelector('.box'), bw = box.offsetWidth, bh = box.offsetHeight;
    const bx = tp.side === 'r' ? Math.min(X + 44, 1080 - 22 - bw) : Math.max(X - 44 - bw, 22);
    const by = Math.max(300, Y - bh / 2);
    const pop = 0.85 + 0.15 * k;
    box.style.left = bx + 'px'; box.style.top = by + 'px'; box.style.transform = `scale(${pop})`; box.style.transformOrigin = tp.side === 'r' ? '0 50%' : '100% 50%';
    const dot = el.querySelector('.dot'); dot.style.left = X + 'px'; dot.style.top = Y + 'px';
    const ax = tp.side === 'r' ? bx : bx + bw, ay = by + bh / 2;
    el.querySelector('path').setAttribute('d', `M${X + (tp.side === 'r' ? 14 : -14)} ${Y} L${ax} ${ay}`);
  }));
  // CTA
  const ctaS = PLAN.find((s) => s.scene === 'cta');
  const ck = eout(clamp((t - ctaS.a - 0.6) / 0.5)); const cta = document.getElementById('cta');
  cta.style.opacity = ck; cta.style.transform = `translateY(${(1 - ck) * 40}px)`;
  // прогресс
  document.getElementById('progbar').style.width = (100 * clamp(t / TL.total)) + '%';
  // субтитры
  const cap = document.getElementById('cap'); const ch = CH.find((c) => t >= c.start - 0.05 && t < c.end);
  if (!ch) { cap.innerHTML = ''; return; }
  const p = eout(clamp((t - ch.start + 0.05) / 0.15));
  cap.innerHTML = `<div class="ln" style="opacity:${p};transform:translateY(${(1 - p) * 10}px)">` + ch.words.map((w) => `<span class="w${t >= w[0] - 0.03 && t < w[0] + Math.max(w[1], 0.2) ? ' on' : ''}">${w[2]}</span>`).join('') + '</div>';
}
function events() {
  const ev = [];
  PLAN.forEach((s, i) => { if (s.tap) ev.push({ t: s.b - 0.55 + 0.3, type: 'tap' }); (s.tips || []).forEach((tp) => ev.push({ t: tp.t0, type: 'tip' })); if (i > 0 && s.sceneA === s.a && s.sceneA > 0) ev.push({ t: s.a, type: 'scene' }); });
  return ev.sort((a, b) => a.t - b.t);
}
window.init = init; window.seek = seek; window.events = events;
